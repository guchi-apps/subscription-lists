# Apache VirtualHost for subscribe-lists (Next.js + pm2)
# apache-vhost.example.conf を実際の値で埋めたもの。
# VPS の Apache 設定ディレクトリに配置して有効化し、certbot で SSL を設定する。

<VirtualHost *:80>
    ServerName subscription.gucchii.com

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:3107/
    ProxyPassReverse / http://127.0.0.1:3107/
</VirtualHost>

<VirtualHost *:443>
    ServerName subscription.gucchii.com

    SSLEngine on
    # certbot --apache -d subscription.gucchii.com で自動設定される想定
    # SSLCertificateFile /etc/letsencrypt/live/subscription.gucchii.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/subscription.gucchii.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:3107/
    ProxyPassReverse / http://127.0.0.1:3107/
</VirtualHost>
